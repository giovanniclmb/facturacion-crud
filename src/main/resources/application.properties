spring.application.name=facturacion-crud
# Aplicación académica sin login: escuchar solo en el equipo local.
server.address=127.0.0.1

spring.datasource.url=jdbc:postgresql://localhost:5432/facturacion_crud
spring.datasource.username=giovita
spring.datasource.password=

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Usuario que figura en la auditoría de las altas y modificaciones (no hay login)
facturacion.usuario-sistema-id=1
# ARCA solo se usa mediante diagnóstico o acciones fiscales explícitas.
spring.config.import=optional:file:./arca-local.properties
arca.habilitado=false
